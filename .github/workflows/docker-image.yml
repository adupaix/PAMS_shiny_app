name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pams-shiny:test
          secrets: |
            GITHUB_PAT="${{ secrets.PAT_GITHUB }}" \
      - name: Run container
        run: |
          docker run -d \
            --name pams-shiny \
            -p 7860:7860 \
            -e SYSREV_KEY="${{ secrets.SYSREV_KEY }}" \
            pams-shiny:test

      - name: Wait for Shiny
        run: |
          sleep 10
          curl --fail http://localhost:7860
            
